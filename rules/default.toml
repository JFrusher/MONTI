# MONTI rules. The table key is the rule id. Each rule sets exactly one of:
#   queries                 one Tree-sitter query per language; findings point at the earliest capture
#   max_comment_code_ratio  per function, with `languages`
#   check                   built-in detector (see README), with `languages`
# `languages = ["*"]` means every language the check supports.

[rules.swallowed-error]
severity = "error"
message = "Error handler is empty: the error is swallowed. Handle it, log it, or let it propagate."

[rules.swallowed-error.queries]
cpp = '''
(catch_clause
  body: (compound_statement) @block
  (#match? @block "^\\{\\s*\\}$"))
'''
csharp = '''
(catch_clause
  body: (block) @block
  (#match? @block "^\\{\\s*\\}$"))
'''
dart = '''
(try_statement
  (catch_clause) . (block) @block
  (#match? @block "^\\{\\s*\\}$"))
'''
go = '''
(if_statement
  condition: (binary_expression left: (identifier) @err right: (nil))
  consequence: (block) @block
  (#eq? @err "err")
  (#match? @block "^\\{\\s*\\}$"))
'''
java = '''
(catch_clause
  body: (block) @block
  (#match? @block "^\\{\\s*\\}$"))
'''
javascript = '''
(catch_clause
  body: (statement_block) @block
  (#match? @block "^\\{\\s*\\}$"))
'''
kotlin = '''
(catch_block
  (block) @block
  (#match? @block "^\\{\\s*\\}$"))
'''
matlab = '''
((catch_clause) @block
  (#match? @block "^catch[^\\n%]*\\s*$"))
'''
php = '''
(catch_clause
  body: (compound_statement) @block
  (#match? @block "^\\{\\s*\\}$"))
'''
python = '''
((except_clause (block . (pass_statement) .) @block) @clause
  (#not-match? @clause "#"))
'''
ruby = '''
((rescue) @block
  (#match? @block "^rescue[^\\n#]*$"))
'''
rust = '''
(match_arm
  pattern: (match_pattern (tuple_struct_pattern type: (identifier) @variant))
  value: (block) @block
  (#eq? @variant "Err")
  (#match? @block "^\\{\\s*\\}$"))
'''
scala = '''
(catch_clause (case_block (case_clause !body)) @block
  (#not-match? @block "//|/\\*"))
'''
swift = '''
((catch_block) @block
  (#match? @block "^catch[^{]*\\{\\s*\\}$"))
'''
tsx = '''
(catch_clause
  body: (statement_block) @block
  (#match? @block "^\\{\\s*\\}$"))
'''
typescript = '''
(catch_clause
  body: (statement_block) @block
  (#match? @block "^\\{\\s*\\}$"))
'''

[rules.commented-error]
severity = "warning"
message = "Error handler holds only comments. Check that swallowing the error is deliberate."

[rules.commented-error.queries]
cpp = '''
(catch_clause
  body: (compound_statement) @block
  (#match? @block "^\\{(\\s|//[^\\n]*|/\\*([^*]|\\*+[^*/])*\\*+/)*\\}$")
  (#not-match? @block "^\\{\\s*\\}$"))
'''
csharp = '''
(catch_clause
  body: (block) @block
  (#match? @block "^\\{(\\s|//[^\\n]*|/\\*([^*]|\\*+[^*/])*\\*+/)*\\}$")
  (#not-match? @block "^\\{\\s*\\}$"))
'''
