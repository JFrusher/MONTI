'''
go = '''
(if_statement
  condition: (binary_expression left: (identifier) @err right: (nil))
  consequence: (block) @block
  (#eq? @err "err")
  (#match? @block "^\\{(\\s|//[^\\n]*|/\\*([^*]|\\*+[^*/])*\\*+/)*\\}$")
  (#not-match? @block "^\\{\\s*\\}$"))
'''
java = '''
(catch_clause
  body: (block) @block
  (#match? @block "^\\{(\\s|//[^\\n]*|/\\*([^*]|\\*+[^*/])*\\*+/)*\\}$")
  (#not-match? @block "^\\{\\s*\\}$"))
'''
javascript = '''
(catch_clause
  body: (statement_block) @block
  (#match? @block "^\\{(\\s|//[^\\n]*|/\\*([^*]|\\*+[^*/])*\\*+/)*\\}$")
  (#not-match? @block "^\\{\\s*\\}$"))
'''
kotlin = '''
(catch_block
  (block) @block
  (#match? @block "^\\{(\\s|//[^\\n]*|/\\*([^*]|\\*+[^*/])*\\*+/)*\\}$")
  (#not-match? @block "^\\{\\s*\\}$"))
'''
matlab = '''
((catch_clause) @block
  (#match? @block "^catch[^\\n%]*(\\s|%[^\\n]*)*$")
  (#match? @block "%"))
'''
php = '''
(catch_clause
  body: (compound_statement) @block
  (#match? @block "^\\{(\\s|//[^\\n]*|/\\*([^*]|\\*+[^*/])*\\*+/)*\\}$")
  (#not-match? @block "^\\{\\s*\\}$"))
'''
python = '''
((except_clause (block) @block) @clause
  (#match? @block "^(\\s|#[^\\n]*)*pass(\\s|#[^\\n]*)*$")
  (#match? @clause "#"))
'''
ruby = '''
((rescue) @block
  (#match? @block "^rescue[^\\n#]*(\\s|#[^\\n]*)*$")
  (#match? @block "#"))
'''
rust = '''
(match_arm
  pattern: (match_pattern (tuple_struct_pattern type: (identifier) @variant))
  value: (block) @block
  (#eq? @variant "Err")
  (#match? @block "^\\{(\\s|//[^\\n]*|/\\*([^*]|\\*+[^*/])*\\*+/)*\\}$")
  (#not-match? @block "^\\{\\s*\\}$"))
'''
scala = '''
(catch_clause (case_block (case_clause !body)) @block
  (#match? @block "//|/\\*"))
'''
swift = '''
((catch_block) @block
  (#match? @block "^catch[^{]*\\{(\\s|//[^\\n]*|/\\*([^*]|\\*+[^*/])*\\*+/)*\\}$")
  (#not-match? @block "^catch[^{]*\\{\\s*\\}$"))
'''
tsx = '''
(catch_clause
  body: (statement_block) @block
  (#match? @block "^\\{(\\s|//[^\\n]*|/\\*([^*]|\\*+[^*/])*\\*+/)*\\}$")
  (#not-match? @block "^\\{\\s*\\}$"))
'''
typescript = '''
(catch_clause
  body: (statement_block) @block
  (#match? @block "^\\{(\\s|//[^\\n]*|/\\*([^*]|\\*+[^*/])*\\*+/)*\\}$")
  (#not-match? @block "^\\{\\s*\\}$"))
