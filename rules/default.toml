[rules.discarded-error]
severity = "warning"
message = "The error result is thrown away. Check it or let it propagate."

[rules.discarded-error.queries]
bash = '''
(list (command) "||" (command name: (command_name (word) @w)) @ignored
  (#any-of? @w "true" ":"))
'''
lua = '''
(block (function_call name: (identifier) @f) @call
  (#any-of? @f "pcall" "xpcall"))
(chunk (function_call name: (identifier) @f) @call
  (#any-of? @f "pcall" "xpcall"))
'''

[rules.type-escape]
severity = "warning"
message = "Type or lint check silenced without naming what. Fix the type, or name the specific code."
skip_tests = true

[rules.type-escape.queries]
python = '''
((comment) @c
  (#match? @c "(type:\\s*ignore|noqa)\\s*$"))
'''
typescript = '''
((predefined_type) @t (#eq? @t "any"))
((comment) @c
  (#match? @c "@ts-(ignore|nocheck)|eslint-disable(-next-line|-line)?\\s*(\\*/)?$"))
'''
tsx = '''
((predefined_type) @t (#eq? @t "any"))
((comment) @c
  (#match? @c "@ts-(ignore|nocheck)|eslint-disable(-next-line|-line)?\\s*(\\*/)?$"))
'''
javascript = '''
((comment) @c
  (#match? @c "eslint-disable(-next-line|-line)?\\s*(\\*/)?$"))
'''

[rules.broad-except]
severity = "warning"
message = "Catches every exception without reporting or re-raising it. Catch the specific error you expect."

[rules.broad-except.queries]
python = '''
((except_clause) @clause
  (#match? @clause "^except\\s*:")
  (#not-match? @clause "\\braise\\b")
  (#not-match? @clause "^[^:]*:(\\s|#[^\\n]*)*pass(\\s|#[^\\n]*)*$"))
((except_clause) @clause
  (#match? @clause "^except\\s+\\(?\\s*(Exception|BaseException)\\s*\\)?\\s*:")
  (#not-match? @clause "\\b(raise|log\\w*|logger|logging|traceback|warn\\w*)\\b")
  (#not-match? @clause "^[^:]*:(\\s|#[^\\n]*)*pass(\\s|#[^\\n]*)*$"))
'''

[rules.undefined-name]
severity = "error"
message = "Called name is never defined, imported, or a builtin; likely hallucinated."
languages = ["*"]
check = "undefined-name"

[rules.unused-parameter]
severity = "warning"
message = "Parameter is never used."
skip_tests = true
languages = ["*"]
check = "unused-parameter"

[rules.comment-flood]
severity = "warning"
message = "Comment-to-code ratio too high; comments likely restate the code."
languages = ["*"]
max_comment_code_ratio = 0.35

[rules.restating-comment]
severity = "warning"
message = "Comment restates the code below it."
languages = ["*"]
check = "restating-comment"

[rules.pass-through-wrapper]
severity = "warning"
message = "Function only forwards its parameters to another call; call the target directly."
languages = ["*"]
check = "pass-through-wrapper"

[rules.redundant-null-check]
severity = "warning"
message = "Null check on a value that was just assigned a non-null value."
languages = ["*"]
check = "redundant-null-check"

[rules.duplicate-function]
severity = "warning"
message = "Structurally duplicates another function; reuse it."
languages = ["*"]
check = "duplicate-function"
min_similarity = 0.85

[rules.ghost-abstraction]
severity = "warning"
message = "Abstraction has a single implementor and at most one use; inline it."
languages = ["*"]
check = "ghost-abstraction"
